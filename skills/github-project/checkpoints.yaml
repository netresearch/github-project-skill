# Example checkpoints.yaml for github-project skill
# Copy this to your skill repo root as checkpoints.yaml

version: 1
skill_id: github-project

mechanical:
  # === FILE EXISTENCE CHECKS ===
  - id: GH-01
    type: file_exists
    target: README.md
    severity: error
    desc: "README.md must exist"

  - id: GH-02
    type: file_exists
    target: LICENSE
    severity: error
    desc: "LICENSE file must exist"

  - id: GH-03
    type: file_exists
    target: SECURITY.md
    severity: warning
    desc: "SECURITY.md should exist for vulnerability reporting"

  - id: GH-04
    type: file_exists
    target: CONTRIBUTING.md
    severity: warning
    desc: "CONTRIBUTING.md should exist"

  - id: GH-05
    type: file_exists
    target: .github/CODEOWNERS
    severity: warning
    desc: "CODEOWNERS should exist for review assignments"

  - id: GH-06
    type: command
    target: "test -f .github/dependabot.yml || test -f renovate.json || test -f .github/renovate.json || test -f .renovaterc.json || test -f .renovaterc"
    severity: warning
    desc: "Dependency update automation should be configured (Dependabot or Renovate)"

  - id: GH-07
    type: file_exists
    target: .github/PULL_REQUEST_TEMPLATE.md
    severity: info
    desc: "PR template should exist"

  - id: GH-08
    type: file_exists
    target: .github/ISSUE_TEMPLATE/bug_report.md
    severity: info
    desc: "Bug report template should exist"

  - id: GH-09
    type: file_exists
    target: .github/ISSUE_TEMPLATE/feature_request.md
    severity: info
    desc: "Feature request template should exist"

  # === CONTENT CHECKS ===
  - id: GH-10
    type: contains
    target: README.md
    pattern: "codecov.io"
    severity: warning
    desc: "README should have Codecov badge"

  - id: GH-11
    type: regex
    target: README.md
    pattern: "github.com/.*/actions/workflows"
    severity: error
    desc: "README should have CI status badge"

  - id: GH-12
    type: regex
    target: README.md
    pattern: "img.shields.io.*license"
    severity: warning
    desc: "README should have license badge"

  # === DEPENDABOT CHECKS ===
  - id: GH-13
    type: regex
    target: .github/dependabot.yml
    pattern: 'package-ecosystem:\s*"?(composer|gomod|npm|pip)"?'
    severity: warning
    desc: "Dependabot should monitor language-specific dependencies (composer, gomod, npm, pip)"

  - id: GH-14
    type: regex
    target: .github/dependabot.yml
    pattern: 'package-ecosystem:\s*"?github-actions"?'
    severity: warning
    desc: "Dependabot should monitor GitHub Actions"

  # === GITIGNORE ===
  - id: GH-17
    type: file_exists
    target: .gitignore
    severity: error
    desc: ".gitignore must exist"

  # === RENOVATE (alternative to Dependabot) ===
  - id: GH-18
    type: file_exists
    target: renovate.json
    severity: info
    desc: "Renovate config may exist as alternative to Dependabot"

  # === SECURITY CONFIG ===
  - id: GH-19
    type: file_exists
    target: .github/workflows/codeql.yml
    severity: warning
    desc: "CodeQL workflow should exist for code scanning"

  - id: GH-20
    type: file_exists
    target: .github/workflows/scorecard.yml
    severity: info
    desc: "OpenSSF Scorecard workflow should exist"

  # === SLSA PROVENANCE ===
  - id: GH-21
    type: regex_not
    target: .github/workflows/*.yml
    pattern: 'slsa-framework/slsa-github-generator'
    severity: warning
    desc: "Should migrate from slsa-github-generator to actions/attest-build-provenance (cannot be SHA-pinned)"

  # === AUTO-MERGE WORKFLOW CHECKS ===
  - id: GH-23
    type: command
    target: "test -f .github/workflows/auto-merge-deps.yml || test -f .github/workflows/auto-merge.yml"
    severity: warning
    desc: "Auto-merge workflow should exist for Dependabot/Renovate PRs"

  - id: GH-24
    type: regex
    target: .github/workflows/auto-merge-deps.yml
    pattern: 'on:\s*\n\s*pull_request_target:'
    severity: error
    desc: "Auto-merge workflow must use pull_request_target trigger (not pull_request) for bot PR write permissions"

  - id: GH-25
    type: regex
    target: .github/workflows/auto-merge-deps.yml
    pattern: 'github\.event\.pull_request\.user\.login'
    severity: warning
    desc: "Auto-merge should check github.event.pull_request.user.login (not github.actor which changes on reruns)"

  - id: GH-26
    type: regex
    target: .github/workflows/auto-merge-deps.yml
    pattern: '--auto'
    severity: warning
    desc: "Auto-merge should use gh pr merge --auto (not direct merge) to respect branch protection and merge queues"

  - id: GH-27
    type: regex
    target: .github/workflows/auto-merge-deps.yml
    pattern: 'gh api.*repos/\$'
    severity: info
    desc: "Auto-merge should dynamically detect merge strategy from repo settings"

  # === AUTO-APPROVE (pr-quality.yml) COPILOT RACE CONDITION ===
  - id: GH-33
    type: command
    target: |
      # If pr-quality.yml exists, verify it triggers on pull_request_review as
      # well as pull_request_target. Without pull_request_review, the approval
      # job races with Copilot and leaves PRs BLOCKED with empty reviewDecision.
      # See references/auto-merge-guide.md → "Auto-Approve Race Condition
      # with Copilot Reviewer".
      WF=.github/workflows/pr-quality.yml
      test -f "$WF" || exit 0   # not applicable if workflow doesn't exist
      grep -qE '^\s*pull_request_review\s*:' "$WF"
    severity: warning
    desc: >-
      pr-quality.yml should also trigger on pull_request_review to avoid the
      Copilot auto-approve race condition (PR stuck BLOCKED with empty
      reviewDecision)

  # === BRANCH PROTECTION AUDIT ===
  - id: GH-30
    type: command
    target: |
      # Require GitHub CLI and a valid GitHub remote slug
      command -v gh >/dev/null 2>&1 || exit 1
      REPO_SLUG=$(git config --get remote.origin.url 2>/dev/null | sed -E 's|.*github\.com[:/](.+/[^.]+)(\.git)?$|\1|')
      test -n "$REPO_SLUG" || exit 1
      DEFAULT_BRANCH=$(gh api "repos/$REPO_SLUG" --jq '.default_branch' 2>/dev/null || echo 'main')
      RESULT=$(gh api "repos/$REPO_SLUG/branches/$DEFAULT_BRANCH/protection" --jq '.enforce_admins.enabled' 2>/dev/null || echo '')
      if [ "$RESULT" = "true" ]; then
        exit 0
      fi
      # Fallback: check rulesets when classic branch protection is not configured
      RULESET_OK=$(gh api "repos/$REPO_SLUG/rulesets" \
        --jq 'map(select(.enforcement == "active" and .target == "branch" and ((.bypass_actors // []) | length == 0))) | any' \
        2>/dev/null || echo 'false')
      test "$RULESET_OK" = "true"
    severity: error
    desc: "enforce_admins must be true on default branch — without it admins can bypass required status checks and review requirements"

  - id: GH-31
    type: command
    target: |
      # Require GitHub CLI and a valid GitHub remote slug
      command -v gh >/dev/null 2>&1 || exit 1
      REPO_SLUG=$(git config --get remote.origin.url 2>/dev/null | sed -E 's|.*github\.com[:/](.+/[^.]+)(\.git)?$|\1|')
      test -n "$REPO_SLUG" || exit 1
      DEFAULT_BRANCH=$(gh api "repos/$REPO_SLUG" --jq '.default_branch' 2>/dev/null || echo 'main')
      RESULT=$(gh api "repos/$REPO_SLUG/branches/$DEFAULT_BRANCH/protection" --jq '.required_conversation_resolution.enabled' 2>/dev/null || echo '')
      if [ "$RESULT" = "true" ]; then
        exit 0
      fi
      # Fallback: check rulesets for review thread resolution
      JQ_FILTER='map(select(
        .enforcement == "active" and .target == "branch"
        and ((.bypass_actors // []) | length == 0)
        and any(.rules[]?;
          .type == "pull_request" and
          (.parameters.required_review_thread_resolution // false)
        )
      )) | any'
      RULESET_OK=$(gh api "repos/$REPO_SLUG/rulesets" \
        --jq "$JQ_FILTER" 2>/dev/null || echo 'false')
      test "$RULESET_OK" = "true"
    severity: error
    desc: "required_conversation_resolution must be enabled — combined with enforce_admins, ensures unresolved review threads block ALL merges including admins"

llm_reviews:
  # === BRANCH PROTECTION + MERGE QUEUE COMPATIBILITY ===
  - id: GH-22
    domain: security
    prompt: |
      Check repository ruleset for merge queue + branch protection compatibility:
      1. If merge_queue is enabled, require_last_push_approval MUST be false
         (merge queue commits dismiss approvals, causing permanent blocks)
      2. If require_code_owner_review is true, verify CODEOWNERS file exists
         on the default branch (enabling without the file blocks all PRs)
      3. For solo-maintainer repos: required_approving_review_count should be 1
         (not 0) paired with an auto-approve workflow

      Check via: gh api repos/OWNER/REPO/rulesets --jq '.[].rules[]'
    severity: error
    desc: "Verify branch protection rules are compatible with merge queue configuration"

  # === AUTO-MERGE CORRECTNESS ===
  - id: GH-28
    domain: ci
    prompt: |
      Verify auto-merge workflow end-to-end correctness:
      1. Trigger must be pull_request_target (not pull_request) — bot PRs
         need write permissions from the base branch context
      2. Bot detection must use github.event.pull_request.user.login
         (not github.actor — actor changes on manual reruns)
      3. Merge command must use --auto flag (respects branch protection,
         merge queues, and required checks)
      4. Merge strategy should be dynamically detected from repo settings
         via gh api, not hardcoded (repos may enable different strategies)
      5. If repo has branch protection requiring reviews, the workflow must
         also approve the PR (gh pr review --approve) before enabling auto-merge
      6. Check for step-security/harden-runner presence
      Report specific issues found.
    severity: warning
    desc: "Verify auto-merge workflow uses correct trigger, bot detection, merge flags, and strategy detection"

  - id: GH-29
    domain: ci
    prompt: |
      Check if pr-quality.yml or auto-approve workflow correctly handles bot accounts:
      1. Bot accounts (dependabot[bot], renovate[bot]) have author_association
         of NONE or CONTRIBUTOR — they are NOT org members/collaborators
      2. If auto-approve checks author_association for OWNER/MEMBER/COLLABORATOR,
         it will NEVER approve bot PRs — this is a common misconfiguration
      3. Correct patterns: check user.login explicitly for known bots,
         OR use gh api collaborators permission check (which works for apps
         with collaborator access)
      4. If branch protection requires approving reviews, bot PRs will be
         permanently BLOCKED without a working auto-approve mechanism
      Report if bot approval flow has this misconfiguration.
    severity: error
    desc: "Verify auto-approve workflow correctly handles bot accounts (author_association is NONE for bots)"

  # === BRANCH PROTECTION ENFORCEMENT AUDIT ===
  - id: GH-32
    domain: security
    prompt: |
      Audit branch protection enforcement on the default branch:
      1. Run: gh api repos/OWNER/REPO/branches/BRANCH/protection --jq '.enforce_admins.enabled'
         Must be true. Without enforce_admins, repository admins can bypass ALL
         branch protection rules: required status checks, required reviews,
         required conversation resolution, and signed commit requirements.
      2. Run: gh api repos/OWNER/REPO/branches/BRANCH/protection --jq '.required_conversation_resolution.enabled'
         Must be true. Without this, unresolved review threads do not block merges.
      3. Verify BOTH are enabled together. enforce_admins alone is insufficient if
         conversation resolution is not required (admins could merge with unresolved
         feedback). Conversation resolution alone is insufficient if enforce_admins
         is false (admins bypass it entirely).
      4. If using rulesets instead of branch protection, check the equivalent:
         gh api repos/OWNER/REPO/rulesets --jq '.[].rules[] | select(.type=="pull_request") | .parameters'
         Look for required_review_thread_resolution: true and bypass_actors being empty.
      Report which settings are missing and the specific security risk each creates.
    severity: error
    desc: "Verify enforce_admins and required_conversation_resolution are both enabled to prevent bypassing review requirements"

  # === SUBJECTIVE CHECKS (require LLM judgment) ===
  - id: GH-15
    domain: repo-health
    rubric: references/llm-rubric.md#badge-order
    severity: warning
    desc: "Verify README badges are in the correct order"

  - id: GH-16
    domain: repo-health
    prompt: |
      Verify the README has a clear structure with these sections:
      - Installation/Setup
      - Usage/Configuration
      - Development (tests, linting)
      - License
      - Credits/Contributors

      Check the actual section headers in README.md and report if it matches.
    severity: info
    desc: "README should have standard structure with key sections"
